<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BI Trust Platform</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232f5bea'/><path d='M9 21l5-6 4 4 6-8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/lineage.css">
  <link rel="stylesheet" href="/static/workspace.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-6 4 4 7-9"/></svg></div>
        <div>
          <div class="brand-name">BI Trust Platform</div>
          <div class="brand-sub">Reconcile · Explain · Trace</div>
        </div>
      </div>
      <!-- Original navigation — kept for reference, disabled for the dashboard workspace layout.
      <nav class="nav" id="nav">
        <a href="#/" data-route="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Overview</a>
        <div class="nav-section">Understand</div>
        <a href="#/models" data-route="models"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 17.5h7M17.5 14v7"/></svg>Power BI models</a>
        <a href="#/lineage" data-route="lineage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 12h4l6-6M11 12l6 6"/></svg>Lineage &amp; impact</a>
        <div class="nav-section">Reconcile</div>
        <a href="#/reconcile" data-route="reconcile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>New reconciliation</a>
        <a href="#/runs" data-route="runs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Results</a>
        <a href="#/templates" data-route="templates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16M9 9v11"/></svg>Templates</a>
        <div class="nav-section">Investigate</div>
        <a href="#/investigations" data-route="investigations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Investigations</a>
        <div class="nav-section">Setup</div>
        <a href="#/sources" data-route="sources"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg>Sources</a>
      </nav>
      -->
      <div class="dash-head">
        <span>Dashboards</span>
        <label class="dash-upload" title="Upload a Power BI file (.pbix, .pbit, .bim, zipped PBIP)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <input type="file" id="dash-upload" accept=".pbix,.pbit,.bim,.zip" hidden>
        </label>
      </div>
      <div class="dash-filter"><input type="search" id="dash-filter" placeholder="Filter dashboards &amp; pages…" aria-label="Filter dashboards and pages"></div>
      <nav class="dash-nav" id="dash-nav" aria-label="Dashboards"></nav>
      <div class="dash-head tools-head"><span>Tools</span></div>
      <nav class="tool-nav" id="tool-nav" aria-label="Tools">
        <a href="#/reconcile" data-route="reconcile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg><span>Reconcile</span></a>
        <a href="#/runs" data-route="runs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg><span>Results</span></a>
        <a href="#/templates" data-route="templates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16M9 9v11"/></svg><span>Templates</span></a>
        <a href="#/investigations" data-route="investigations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Investigations</span></a>
        <a href="#/lineage" data-route="lineage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 12h4l6-6M11 12l6 6"/></svg><span>Lineage explorer</span></a>
        <a href="#/sources" data-route="sources"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg><span>Sources &amp; files</span></a>
      </nav>
      <div class="sidebar-foot"><span class="dot"></span>Runs locally · nothing leaves this machine</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="crumbs" id="crumbs"></div>
        <span class="spacer"></span>
        <a class="btn ghost sm" href="/docs" target="_blank" rel="noopener">API docs</a>
        <button class="btn ghost icon-btn" id="theme-toggle" title="Toggle light / dark theme" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </header>
      <div class="content"><div id="view" class="page"></div></div>
    </main>
    <aside class="rightbar" id="rightbar" aria-label="Measures" hidden></aside>
  </div>
  <div class="toast-wrap" id="toasts"></div>
  <script src="/static/lineage.js"></script>
  <script src="/static/workspace.js"></script>
  <script src="/static/app.js"></script>

</html>
